lidar_odom_node:
  ros__parameters:
    scan_topic: /scan_slam       # ICP에 사용할 전방 필터 LiDAR topic
    imu_topic: /imu              # yaw rate를 받을 IMU topic
    odom_topic: /lidar_odom      # 계산한 nav_msgs/Odometry 출력 topic
    odom_frame_id: odom          # 누적 상대 이동의 기준 frame
    base_frame_id: base_link     # 출력할 차량 frame(뒷바퀴 축 중앙)
    laser_frame_id: laser_frame  # 입력 LaserScan이 가져야 할 frame
    imu_frame_id: base_imu_link  # 입력 Imu가 가져야 할 frame
    publish_tf: true             # odom -> base_link TF 발행 여부

    # Gyro z is integrated only once into scan-to-scan relative yaw. Linear
    # acceleration and the driver's orientation quaternion are never used.
    use_imu: true                   # gyro z 상대 yaw만 LiDAR odometry에 보조 사용
    imu_yaw_sign: -1.0              # 실차 측정상 /imu gyro z 부호가 ROS yaw와 반대
    gyro_bias_z: 0.0                # 부호 보정 후 알고 있는 z축 gyro bias(rad/s)
    gyro_calibration_duration: 2.0  # 시작 정지 상태에서 bias를 측정할 시간(s)
    imu_yaw_weight: 0.3             # ICP 초기 yaw에서 IMU가 차지하는 비율
    imu_timeout_sec: 0.20            # scan 시각과 IMU가 이보다 멀면 융합하지 않음
    imu_yaw_fusion_weight: 0.30      # 정상 ICP에서도 gyro yaw를 반영할 최소 비율
    imu_yaw_low_quality_weight: 0.70 # ICP 품질이 낮을 때 gyro yaw 반영 비율
    imu_yaw_good_inlier_ratio: 0.65  # 이 비율 이상이면 ICP yaw를 양호하게 판단
    imu_yaw_good_rmse: 0.08          # 이 RMSE 이하면 ICP yaw를 양호하게 판단(m)
    deskew_scan: true               # scan 취득 중 차량 이동·회전 왜곡 보정

    # Must match the base_link -> laser_frame static transform.
    lidar_x: 0.410   # base_link에서 LiDAR까지 전방 거리(m)
    lidar_y: 0.0     # base_link에서 LiDAR까지 좌측 거리(m)
    lidar_yaw: 0.0   # base_link 기준 LiDAR 장착 회전(rad)

    min_range: 0.1              # 이 거리보다 가까운 점 제거(m)
    # Mapping과 AMCL이 모두 7 m까지만 사용하므로 odometry도 일치시킨다.
    max_range: 7.0               # 이 거리보다 먼 점 제거(m)
    voxel_size: 0.05             # 같은 voxel의 점을 합칠 격자 크기(m)
    max_scan_points: 400         # 한 scan에서 ICP에 사용할 최대 점 수
    max_submap_points: 2400      # rolling local submap의 최대 점 수
    submap_keyframes: 15         # local submap에 유지할 최근 keyframe 수
    keyframe_translation: 0.15   # 새 keyframe을 추가할 최소 이동 거리(m)
    keyframe_rotation: 0.08      # 새 keyframe을 추가할 최소 회전량(rad)

    # 실차 정지 scan에서 가장 안정적이었던 Point-to-Point를 기본 matcher로 사용한다.
    use_hybrid_icp: false
    hybrid_max_iterations: 12          # shared-query Gauss-Newton 반복 상한
    hybrid_line_weight: 1.0            # Point-to-Line 그룹 평균 오차 가중치
    hybrid_point_weight: 1.0           # Point-to-Point 그룹 평균 오차 가중치
    hybrid_min_group_correspondences: 5 # 너무 작은 특징 그룹은 최적화에서 제외
    hybrid_min_rank: 3                 # SE(2) 세 축이 관측될 때만 hybrid 채택

    # Point-to-Line과 Hybrid는 후속 실차 튜닝을 위해 코드만 유지한다.
    use_point_to_line: false
    point_to_line_max_iterations: 12  # 선형 구조용 Gauss-Newton 반복 상한
    max_point_to_line_rmse: 0.08      # 벽 법선 방향 잔차 허용치(m)
    normal_neighbors: 8               # PCA normal 계산에 사용할 최대 이웃 수
    normal_search_radius: 0.40        # normal 이웃을 찾을 반경(m)
    normal_min_neighbors: 5           # normal을 인정할 최소 이웃 수
    normal_min_linearity: 0.80        # 코너/산개점을 버릴 최소 선형성
    normal_max_angle: 0.785398        # source-target normal 허용각(45도)
    point_to_line_svd_rcond: 0.001    # 관측 불가능한 SVD 축 제거 기준
    point_to_line_max_condition_number: 10000.0
    fallback_to_point_to_point: true
    max_prediction_correction: 0.30          # 예측 대비 ICP 병진 보정 상한(m)
    max_prediction_rotation_correction: 0.20 # 예측 대비 회전 보정 상한(rad)

    icp_max_iterations: 20            # Point-to-Point 반복 상한
    max_correspondence_distance: 0.3 # 대응점으로 인정할 최대 거리(m)
    trim_fraction: 0.80               # 가까운 대응점 중 실제 최적화에 쓸 비율
    min_correspondences: 30           # ICP 결과를 인정할 최소 대응점 수
    min_inlier_ratio: 0.30            # 전체 scan 중 대응된 점의 최소 비율
    max_rmse: 0.15                    # ICP 결과를 인정할 최대 평균 오차(m)
    # 10 Hz에서 저속 이동을 계속 정지로 판정하지 않도록 센서 노이즈 수준만 제거한다.
    stationary_translation_deadband: 0.004 # 이보다 작은 scan 간 이동은 정지 노이즈(m)
    stationary_rotation_deadband: 0.003    # 이보다 작은 scan 간 회전은 정지 노이즈(rad)
    enforce_nonholonomic: true             # 후륜축 base_link 이동을 무미끄럼 원호로 투영
    recovery_after_failures: 3        # 연속 실패 시 예측 없이 P2P를 재시도할 기준
    max_translation_per_scan: 0.80    # scan 한 장 사이 허용할 최대 이동(m)
    max_rotation_per_scan: 0.50       # scan 한 장 사이 허용할 최대 회전(rad)
    diagnostics_period_sec: 5.0       # ICP 속도/품질 통계 발행 주기(s)
