amcl:
  ros__parameters:
    # Initial conservative values based on the Nav2 Humble defaults.
    # Tune these using recorded bags from the actual competition vehicle.
    alpha1: 0.1  # 회전할 때 발생하는 회전 odom 노이즈
    alpha2: 0.1  # 이동할 때 발생하는 회전 odom 노이즈
    alpha3: 0.1  # 이동할 때 발생하는 병진 odom 노이즈
    alpha4: 0.1  # 회전할 때 발생하는 병진 odom 노이즈
    alpha5: 0.1  # Omni 모델의 횡이동 노이즈(현재 모델에서는 미사용)

    base_frame_id: base_link    # 추정할 차량 기준점(뒷바퀴 축 중앙)
    global_frame_id: map       # 정적 지도의 전역 좌표계
    odom_frame_id: odom        # LiDAR odometry의 로컬 좌표계
    tf_broadcast: true         # AMCL이 map -> odom TF를 발행
    transform_tolerance: 1.0   # TF를 미래 시각까지 허용하는 여유(s)

    robot_model_type: nav2_amcl::DifferentialMotionModel  # 비홀로노믹 차량 운동 모델

    laser_model_type: likelihood_field  # 지도 장애물까지 거리로 scan 점수 계산
    laser_likelihood_max_dist: 2.0      # 장애물 거리장을 계산할 최대 거리(m)
    laser_min_range: -1.0               # 음수면 LaserScan의 최소 거리 사용
    laser_max_range: 100.0              # AMCL에서 사용할 LiDAR 최대 거리(m)
    max_beams: 100                      # 한 번의 갱신에 균등 선택할 최대 beam 수
    sigma_hit: 0.15                      # 올바른 검출점 거리 오차의 표준편차(m)
    lambda_short: 0.1                   # Beam 모델용 짧은 측정 계수(현재 미사용)
    z_hit: 0.5                          # 정상 장애물 검출 모델 가중치
    z_short: 0.05                       # Beam 모델용 짧은 측정 가중치(현재 미사용)
    z_max: 0.05                         # Beam 모델용 최대 거리 가중치(현재 미사용)
    z_rand: 0.5                         # 무작위 측정 모델 가중치

    do_beamskip: false             # 다수 particle과 불일치하는 beam 제거 여부
    beam_skip_distance: 0.5        # beam 불일치를 판정할 지도 장애물 거리(m)
    beam_skip_threshold: 0.3       # skip 대상으로 판정할 beam 비율 기준
    beam_skip_error_threshold: 0.9 # 불일치가 너무 많을 때 전체 beam 복구 기준

    min_particles: 500         # KLD sampling이 유지할 최소 particle 수
    max_particles: 3000        # 전역 탐색에서 사용할 최대 particle 수
    pf_err: 0.05               # particle 분포 근사에서 허용할 KLD 오차
    pf_z: 0.99                 # KLD 오차 한계를 만족시킬 신뢰확률
    resample_interval: 1       # 센서 갱신 몇 회마다 resampling할지 지정
    recovery_alpha_fast: 0.0   # 단기 평균 가중치 갱신률(0이면 recovery 비활성)
    recovery_alpha_slow: 0.0   # 장기 평균 가중치 갱신률(0이면 recovery 비활성)

    update_min_d: 0.05  # 이 거리 이상 이동하면 sensor update 수행(m)
    update_min_a: 0.05  # 이 각도 이상 회전하면 sensor update 수행(rad)
    save_pose_rate: 0.5 # 마지막 pose를 저장하는 최대 빈도(Hz)
    scan_topic: scan    # launch에서 /scan_slam으로 remapping되는 입력 이름
