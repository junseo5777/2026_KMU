hybrid_astar_planner:
  ros__parameters:
    # These values are already expressed in the parking_map ``map`` frame.
    mission_start_pose: [1.8, 0.9, 3.14]
    mission_parking_a_pose: [0.0, 4.2, 0.0]
    mission_parking_b_pose: [2.1, 3.3, -1.57]

    # Require a trustworthy initial localization near the marked start box.
    mission_start_position_tolerance: 0.50  # m
    mission_start_yaw_tolerance_deg: 30.0   # deg

    # Hold each accepted parking pose before publishing the next leg.
    mission_dwell_sec: 1.0                  # s
    # A terminal follower stop inside this radius counts as a visit even when
    # the strict 0.15 m/yaw GOAL_REACHED condition was not satisfied.
    mission_near_goal_distance: 0.30        # m; no yaw gate
