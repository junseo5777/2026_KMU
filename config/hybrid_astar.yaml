hybrid_astar_planner:
  ros__parameters:
    # preview: RViz 2D Pose Estimate를 가상 출발점으로 사용한다.
    # localization: 최신 /amcl_pose를 실제 출발점으로 사용한다.
    start_mode: preview
    map_frame: map

    # forward_then_final_reverse: 목표 근처까지 전진 후 필요할 때만 1회 후진.
    # legacy: 기존 양방향 Hybrid A* 동작을 그대로 사용한다.
    planning_behavior: forward_then_final_reverse
    # RViz 목표 도착 후, 목표를 찍었을 때 저장한 출발 pose로 자동 복귀한다.
    return_to_start: true
    # 최종 복구까지 실패해도 목표에서 이 거리 이내면 방문한 것으로 보고 복귀한다.
    return_near_goal_distance: 0.30  # m; yaw는 근접 실패 판정에 사용하지 않음
    # 이 반경 안까지 먼저 전진 탐색하며, 최종 연결도 이보다 길 수 없다.
    reverse_activation_radius: 1.20  # m; 이 안에서만 후진 시작 가능
    max_reverse_length: 1.5         # 마지막 후진 구간의 최대 누적 길이(m)

    # kmu_parking.pgm의 회색(205) 미탐색 셀이 자유 공간으로 풀리지 않게 한다.
    free_thresh_override: 0.19
    occupied_thresh_override: -1.0  # 음수면 지도 YAML 값을 사용
    unknown_is_blocked: true

    # localization 모드에서만 적용되는 AMCL 품질 gate.
    max_position_stddev: 0.50       # m
    max_yaw_stddev: 0.261799        # rad (15 deg)
    pose_timeout_sec: 2.0

    # 차량 운동학. wheel_base / tan(max_steer) ~= 0.74 m.
    wheel_base: 0.345               # m
    max_steer_deg: 25.0             # deg (실차 조향 한계 확인 필요)
    steer_count: 9
    allow_reverse: true

    # Hybrid A* primitive와 상태 격자.
    step: 0.25                      # 한 primitive의 호 길이(m)
    substeps: 3                     # primitive 내부 충돌검사 표본 수
    xy_resolution: 0.15             # 상태 중복 판정 격자(m)
    yaw_resolution_deg: 5.0         # 상태 중복 판정 각도(deg)

    # 차량 footprint 바깥의 추가 여유와 장애물 근접 비용 범위.
    collision_margin: 0.01          # m
    safe_dist: 0.30                 # m

    # 경로 비용. w_reverse는 후진 1 m마다 추가되는 비용이다.
    w_length: 1.0
    w_steer: 0.35
    w_steer_change: 0.5
    w_obstacle: 1.5
    w_reverse: 1.4                  # 기존 1.7보다 살짝 높임
    w_gear_change: 2.0

    # 탐색 성능/품질 절충.
    heuristic_weight: 1.4
    heuristic_coarse_factor: 5
    max_expansions: 40000
    time_limit: 10.0                # s

    # 두 탐색 트리를 잇는 clothoid analytic expansion.
    connect_interval: 5
    connect_radius: 2.0             # m
    connect_max_length: 5.0         # m

    # nav_msgs/Path 출력 점 간격.
    output_spacing: 0.05            # m
